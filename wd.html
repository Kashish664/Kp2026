<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Content Demo</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { display: flex; flex-direction: column; gap: 20px; }
        
        /* Styling the iframes */
        .frame-wrapper {
            border: 2px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        iframe {
            width: 100%; /* Responsive width */
            height: 400px;
            border: none; /* Removes default browser border */
        }

        /* Specialized styling for a cleaner look */
        .map-frame { height: 350px; }
        .web-frame { height: 500px; }
    </style>
</head>
<body>

    <h1>Embedding Maps and External Pages</h1>
    
    <div class="container">
        <!-- 1. Embedding a Map (Google Maps) -->
        <div class="frame-wrapper">
            <h3>Our Location</h3>
            <iframe 
                class="map-frame"
                src="https://google.com" 
                allowfullscreen="" 
                loading="lazy">
            </iframe>
        </div>

        <!-- 2. Embedding an External Page -->
        <div class="frame-wrapper">
            <h3>External Resource (google.com)</h3>
            <iframe 
                class="web-frame"
                src="https://example.com" 
                title="Example Web Page">
            </iframe>
        </div>
    </div>

</body>
</html>
